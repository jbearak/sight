name: Release Publish

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string
      publish_vscode:
        description: 'Publish to VS Code Marketplace + OpenVSX'
        required: false
        type: boolean
        default: false
      build_run_id:
        description: 'release-build workflow run ID containing artifacts'
        required: true
        type: string

# Serialize by tag so retries/second runs don't collide.
concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

# Default to read-only permissions. The publish job requests the write scopes
# it needs for GitHub Releases and npm Trusted Publishing.
permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write

    # IMPORTANT: configure this Environment in GitHub with required reviewers.
    # npm Trusted Publishing binds to this exact workflow + environment and
    # uses OIDC, so no long-lived NPM_TOKEN secret is required.
    environment: release

    steps:
      - name: Checkout tag
        # Pinned action SHA for supply-chain safety.
        # How to update:
        #  1) Pick the desired tag in the action repo Releases page.
        #  2) Resolve tag -> commit SHA via GitHub API:
        #     https://api.github.com/repos/<OWNER>/<REPO>/git/ref/tags/<TAG>
        #     If object.type="tag", dereference:
        #     https://api.github.com/repos/<OWNER>/<REPO>/git/tags/<SHA_FROM_REF>
        #
        #     GitHub CLI examples:
        #       gh api repos/<OWNER>/<REPO>/git/ref/tags/<TAG>
        #       # if object.type == "tag":
        #       gh api repos/<OWNER>/<REPO>/git/tags/<SHA_FROM_REF>
        #  3) Replace the SHA in the uses: line; keep the trailing "# vX" comment.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag + version
        shell: bash
        run: |
          set -euo pipefail

          the_tag='${{ inputs.tag }}'

          # Basic format validation
          if [[ ! "$the_tag" =~ ^v[0-9] ]]; then
            echo "ERROR: tag must start with 'v' and a digit (e.g., v1.2.3). Got: $the_tag" >&2
            exit 1
          fi
          if [[ "$the_tag" =~ [[:space:]] ]]; then
            echo "ERROR: tag must not contain whitespace. Got: $the_tag" >&2
            exit 1
          fi

          # Confirm tag exists in the checked-out repo
          if ! git rev-parse -q --verify "refs/tags/$the_tag" >/dev/null; then
            echo "ERROR: tag does not exist in this repository: $the_tag" >&2
            exit 1
          fi

          # Confirm tag matches root package.json version (strip leading v)
          the_pkg_version=$(node -p "require('./package.json').version")
          the_expected_tag="v${the_pkg_version}"
          if [[ "$the_tag" != "$the_expected_tag" ]]; then
            echo "ERROR: tag/version mismatch. tag=$the_tag package.json=$the_pkg_version (expected tag $the_expected_tag)" >&2
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Download build artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_NAME="release-${{ inputs.tag }}"
          the_build_run_id="$BUILD_RUN_ID_INPUT"
          if [[ ! "$the_build_run_id" =~ ^[0-9]+$ ]]; then
            echo "ERROR: build_run_id must be numeric. Got: $the_build_run_id" >&2
            exit 1
          fi
          BUILD_RUN_ID="$the_build_run_id"
          echo "Downloading artifact from build run: $BUILD_RUN_ID"
          gh run download "$BUILD_RUN_ID" --name "$ARTIFACT_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID_INPUT: ${{ inputs.build_run_id }}

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          if [ -d bin ]; then
            (cd bin && for file in sight-*; do 
              if [[ "$file" != *.sha256 ]]; then
                sha256sum -c "$file.sha256"
              fi
            done)
          fi
          (cd dist && sha256sum -c sight-server.js.sha256)
          if ls client/*.vsix.sha256 >/dev/null 2>&1; then
            (cd client && sha256sum -c *.vsix.sha256)
          fi

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Publish to npm
        run: npm publish --ignore-scripts --access public

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.publish_vscode }}
        run: |
          # Publish pre-built .vsix (skip rebuild)
          npx vsce publish --packagePath client/*.vsix --pat ${{ secrets.VSCE_TOKEN }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to OpenVSX Registry
        if: ${{ inputs.publish_vscode }}
        run: |
          # Publish pre-built .vsix (skip rebuild)
          npx ovsx publish client/*.vsix --pat ${{ secrets.OVSX_TOKEN }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Create GitHub Release
        # Pinned action SHA for supply-chain safety.
        # Tag v3.0.1 -> commit 2bb465e97f322d3cb2a965294d483e0d26a67aa9
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/sight-*
            dist/sight-server.js
            dist/sight-server.js.sha256
            client/*.vsix
            client/*.vsix.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Homebrew tap bump ───────────────────────────────────────────────
  # After the release is published, open a PR against the Homebrew tap
  # (jbearak/homebrew-sight) bumping the formula to this version, with the
  # Apple Silicon checksum recomputed from the same build artifact this run
  # published (no dependence on release-CDN propagation). The tap's own CI
  # (brew audit / install / test) gates that PR, and auto-merge lands it once
  # green — so a broken formula never reaches users. The formula edit lives in
  # the tap repo (bin/update-formula.sh), the single source of truth.
  #
  # Setup (one-time), then this job activates itself:
  #   gh secret   set HOMEBREW_TAP_TOKEN   -R jbearak/sight   # paste token
  #   gh variable set ENABLE_HOMEBREW_BUMP -R jbearak/sight --body true
  # HOMEBREW_TAP_TOKEN: a GitHub App installation token or fine-grained PAT
  # scoped to jbearak/homebrew-sight with Contents:write + Pull requests:write.
  bump-homebrew:
    needs: publish
    if: vars.ENABLE_HOMEBREW_BUMP == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the macOS arm64 binary from the build run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TAG: ${{ inputs.tag }}
        run: gh run download "$BUILD_RUN_ID" --name "release-$TAG" --dir art

      - name: Checkout Homebrew tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: jbearak/homebrew-sight
          # Public repo: no token needed to clone, and persist-credentials:false
          # keeps any credential out of tap/.git/config. The tap PAT is supplied
          # only at push time (below), never persisted to disk.
          persist-credentials: false
          path: tap

      - name: Bump formula
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          tap/bin/update-formula.sh "$VERSION" art/bin/sight-darwin-arm64

      - name: Open bump PR + enable auto-merge
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if git diff --quiet; then
            echo "Formula already at $VERSION — nothing to do."
            exit 0
          fi
          BRANCH="bump-sight-$VERSION"
          git config user.name "sight-release-bot"
          git config user.email "sight-release-bot@users.noreply.github.com"
          # Only this job ever writes bump-sight-*, so reset the branch from
          # HEAD and force-push. No remote-tracking ref / pre-fetch needed, so
          # reruns can't fail on a stale lease.
          git checkout -B "$BRANCH"
          git add Formula/sight.rb
          git commit -m "sight $VERSION"
          # Authenticate the push with the tap token only here, via an HTTPS
          # basic-auth header (the actions/checkout mechanism). The token is
          # never written to .git/config.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" push --force origin "HEAD:$BRANCH"
          # Create the PR. Tolerate ONLY the "PR already exists" case (rerun);
          # let auth/permission/API errors fail the job.
          if ! gh pr create --base main --head "$BRANCH" \
                --title "sight $VERSION" \
                --body "Automated formula bump for [sight $VERSION](https://github.com/jbearak/sight/releases/tag/$TAG). Checksum recomputed from the release artifact."; then
            if gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
              echo "PR for $BRANCH already exists; the force-push updated it."
            else
              echo "::error::gh pr create failed for $BRANCH" >&2
              exit 1
            fi
          fi
          # Auto-merge once the tap's required `test` check passes (branch
          # protection makes it wait rather than merge immediately).
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::could not enable auto-merge; merge $BRANCH manually."
