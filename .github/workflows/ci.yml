---
name: CI

"on":
  pull_request:
  workflow_dispatch:

# Avoid wasting CI minutes by canceling older runs of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to the minimum scopes every job needs:
#   - contents: read -> actions/checkout + build/test steps
#   - pull-requests: read -> dorny/paths-filter in the `changes` job
# No job in this workflow pushes commits, comments on PRs, or publishes
# packages; those responsibilities live in the release/update workflows,
# which declare their own permissions. (The VSIX is passed between jobs
# as a short-lived artifact, which needs no token scope.)
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      binaries: ${{ steps.filter.outputs.binaries }}
    steps:
      # Pinned action SHAs for supply-chain safety.
      # How to update:
      #  1) Pick the desired tag in the action repo Releases page (e.g. https://github.com/actions/checkout/releases).
      #  2) Resolve tag -> commit SHA via GitHub API:
      #     https://api.github.com/repos/<OWNER>/<REPO>/git/ref/tags/<TAG>
      #     If object.type="tag" (annotated tag), dereference:
      #     https://api.github.com/repos/<OWNER>/<REPO>/git/tags/<SHA_FROM_REF>
      #
      #     GitHub CLI examples:
      #       gh api repos/<OWNER>/<REPO>/git/ref/tags/<TAG>
      #       # if object.type == "tag":
      #       gh api repos/<OWNER>/<REPO>/git/tags/<SHA_FROM_REF>
      #  3) Replace the SHA in uses: lines; keep the trailing "# vX" comments.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            # "server" is the base set that should run tests/typecheck.
            server:
              - 'package.json'
              - 'bun.lock'
              - '.npmignore'
              - '.gitattributes'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-build.yml'
              - '.github/workflows/release-publish.yml'
              - 'README.md'
              - 'DEVELOPMENT.md'
              - 'docs/**'
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'

            # Client packaging depends on both client/ and the server bundle.
            client:
              - 'client/**'
              - '.github/workflows/release-build.yml'
              - '.github/actions/setup-zig/**'
              - 'scripts/build-pty-helper.ts'
              - 'src/**'
              - 'package.json'
              - 'bun.lock'
              - 'client/package.json'
              - 'client/bun.lock'

            # Binaries are built from the server source + binary build scripts.
            binaries:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-build.yml'
              - 'src/**'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/build-binary.ts'
              - 'scripts/binary-names.ts'
              - 'scripts/binary-ownership.ts'
              - 'scripts/install.ts'
              - 'scripts/smoke-stdio-startup.ts'
              - 'scripts/uninstall.ts'

  verify:
    name: Verify (typecheck + tests)
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Line endings
        run: bun run check:line-endings
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test

  data-browser-bench:
    # Report-only: numbers go to the job summary and never fail CI. Runs
    # the data-browser benchmark at 10% of the full fixture sizes with
    # the page cache dropped before every sample (cold reads), which the
    # GitHub runner's passwordless sudo allows. Budgets and their source
    # are in specs/2026-10-30-data-browser-redesign.md.
    name: Data browser benchmark (report only)
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Benchmark
        run: >-
          bun run bench:data-browser
          --dir "$RUNNER_TEMP/sight-bench"
          --scale 0.1
          --cold
          --out "$RUNNER_TEMP/data-browser-bench.md"
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/data-browser-bench.md" ]; then
            cat "$RUNNER_TEMP/data-browser-bench.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  npm-package:
    name: NPM package
    needs: [changes, verify]
    if: needs.changes.outputs.server == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Build npm package
        run: bun run build:npm
      - name: Test package creation
        run: npm pack --dry-run
      - name: Test global installation
        shell: bash
        run: |
          npm install -g .
          VERSION_PATTERN='^sight [0-9]+\.[0-9]+\.[0-9]+'
          VERSION_PATTERN+='(-[0-9A-Za-z.-]+)?$'
          sight --version | grep -E "$VERSION_PATTERN"
          sight --help | grep 'static analyzer and language server for Stata'
      - name: Test LSP stdio startup
        shell: bash
        run: bun scripts/smoke-stdio-startup.ts sight

  vscode-extension:
    name: VS Code extension
    needs: [changes, verify]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
      - name: Build extension
        run: bun run package
      - name: Upload VSIX for the helper check
        # Pinned action SHA for supply-chain safety.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-vsix
          if-no-files-found: error
          retention-days: 3
          path: client/*.vsix
      - name: Validate VSIX contents
        run: |
          cd client
          shopt -s nullglob
          vsix_files=( *.vsix )
          if [ ${#vsix_files[@]} -eq 0 ]; then
            echo "ERROR: No .vsix package produced"
            exit 1
          fi
          vsix="${vsix_files[0]}"
          ls -la "$vsix"

          # Verify required bundled files are present and non-trivial
          for f in extension/dist/extension.js extension/server/server.js; do
            size=$(unzip -l "$vsix" "$f" 2>/dev/null | awk -v f="$f" '$4 == f {print $1}')
            if [ -z "$size" ] || [ "$size" -lt 1000 ]; then
              echo "ERROR: $f missing or too small (${size:-0} bytes)"
              exit 1
            fi
            echo "OK: $f ($size bytes)"
          done

          # Verify node_modules did NOT leak into the VSIX
          if unzip -l "$vsix" | grep -q 'extension/node_modules/'; then
            echo "ERROR: node_modules leaked into VSIX"
            unzip -l "$vsix" | grep 'extension/node_modules/' | head -5
            exit 1
          fi
          echo "OK: no node_modules in VSIX"

          # Verify a sight-pty helper for every target, executable
          bun ../scripts/check-vsix-pty-helpers.ts "$vsix"

          # Verify manifest
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.engines?.vscode) throw new Error('Missing VS Code engine');
            if (pkg.bundledDependencies) throw new Error('bundledDependencies should not exist (deps are esbuild-inlined)');
            console.log('Extension:', pkg.displayName);
            console.log('Version:', pkg.version);
            console.log('Publisher:', pkg.publisher);
          "

  pty-helper-macos:
    name: sight-pty helper on macOS
    needs: vscode-extension
    runs-on: macos-latest
    steps:
      - name: Download VSIX
        # Pinned action SHA for supply-chain safety.
        # Tag v8.0.2 -> commit 9000827ccba6bdab643e8b6fd33ac0654aef8333
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-vsix
      - name: Run the packaged darwin-arm64 helper
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o ./*.vsix 'extension/pty-helper/bin/*' -d vsix
          helper=vsix/extension/pty-helper/bin/darwin-arm64/sight-pty
          codesign -v "$helper"
          # Keep the helper's input open while the command runs (EOF
          # hangs it up); the frames carry its text and an exit frame.
          out=$( (sleep 2) | "$helper" 80 24 -- /bin/echo sight-pty-ok | tr -d '\000-\010')
          echo "$out"
          grep -q 'sight-pty-ok' <<<"$out"
          grep -q 'X' <<<"$out"

  binaries:
    name: Binary artifacts
    needs: [changes, verify]
    if: needs.changes.outputs.binaries == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Build current platform binary
        run: bun run build:current
      - name: Test binary execution
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) BINARY="bin/sight-windows-x64.exe";;
            macOS)   BINARY="bin/sight-darwin-arm64";;
            *)       BINARY="bin/sight-linux-x64";;
          esac

          chmod +x "$BINARY" 2>/dev/null || true
          "$BINARY" --version
          "$BINARY" --help
      - name: Test LSP stdio startup
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) BINARY="bin/sight-windows-x64.exe";;
            macOS)   BINARY="bin/sight-darwin-arm64";;
            *)       BINARY="bin/sight-linux-x64";;
          esac

          bun scripts/smoke-stdio-startup.ts "$BINARY"
