name: Release Build

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.2.3)'
        required: true
        type: string

# Releases should be strictly serialized per tag.
concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Pinned action SHA for supply-chain safety.
      # How to update:
      #  1) Pick the desired tag in the action repo Releases page (e.g. https://github.com/actions/checkout/releases).
      #  2) Resolve tag -> commit SHA via GitHub API:
      #     https://api.github.com/repos/actions/checkout/git/ref/tags/<TAG>
      #     If it returns object.type="tag" (annotated tag), dereference:
      #     https://api.github.com/repos/actions/checkout/git/tags/<SHA_FROM_REF>
      #
      #     GitHub CLI examples:
      #       gh api repos/actions/checkout/git/ref/tags/<TAG>
      #       # if object.type == "tag":
      #       gh api repos/actions/checkout/git/tags/<SHA_FROM_REF>
      #  3) Replace the SHA below; keep the trailing comment with the major tag (e.g. "# v4").
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test ./tests

  package:
    permissions:
      actions: write
      contents: read
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build bundle for npm
        run: bun run build:npm

      - name: Build VS Code extension
        run: bun run package

      - name: Validate bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/smoke-stdio-startup.ts ./dist/sight-server.js

      - name: Upload package artifacts
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/sight-server.js
            client/*.vsix

  linux-binaries:
    permissions:
      actions: write
      contents: read
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/build-binary.ts target sight-linux-x64
          bun scripts/build-binary.ts target sight-linux-arm64

      - name: Smoke-test Linux x64 binary
        run: bun scripts/smoke-stdio-startup.ts ./bin/sight-linux-x64

      - name: Build Windows ARM64 binary
        run: bun scripts/build-binary.ts target sight-windows-arm64.exe

      - name: Upload Linux binaries
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/sight-linux-x64
            bin/sight-linux-arm64

      - name: Upload Windows ARM64 binary
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/sight-windows-arm64.exe

  darwin-binaries:
    permissions:
      actions: write
      contents: read
    needs: verify
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build macOS binary
        run: bun scripts/build-binary.ts target sight-darwin-arm64

      - name: Validate macOS binary
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --verbose ./bin/sight-darwin-arm64
          bun scripts/smoke-stdio-startup.ts ./bin/sight-darwin-arm64

      - name: Upload macOS binary
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-darwin
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/sight-darwin-arm64


  windows-binaries:
    permissions:
      actions: write
      contents: read
    needs: verify
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Windows x64 binary
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/build-binary.ts target sight-windows-x64.exe

      - name: Smoke-test Windows x64 binary
        shell: bash
        run: bun scripts/smoke-stdio-startup.ts ./bin/sight-windows-x64.exe

      - name: Upload Windows x64 binary
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/sight-windows-x64.exe

  assemble:
    permissions:
      actions: write
      contents: read
    needs: [package, linux-binaries, darwin-binaries, windows-binaries]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download package artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-package --dir .

      - name: Download Linux binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-linux --dir bin

      - name: Download macOS binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-darwin --dir bin

      - name: Download Windows x64 binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-windows-x64 --dir bin

      - name: Download Windows ARM64 binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$GITHUB_RUN_ID" --name release-windows-arm64 --dir bin

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected_binaries=(
            sight-darwin-arm64
            sight-linux-x64
            sight-linux-arm64
            sight-windows-x64.exe
            sight-windows-arm64.exe
          )
          for binary_name in "${expected_binaries[@]}"; do
            test -s "bin/$binary_name"
          done
          test -s dist/sight-server.js
          shopt -s nullglob
          vsix_files=( client/*.vsix )
          test "${#vsix_files[@]}" -eq 1
          chmod +x dist/sight-server.js
          chmod +x bin/sight-darwin-arm64 bin/sight-linux-x64 bin/sight-linux-arm64
          bun scripts/smoke-stdio-startup.ts ./dist/sight-server.js
          bun scripts/smoke-stdio-startup.ts ./bin/sight-linux-x64

      - name: Calculate checksums
        run: |
          cd bin
          for file in sight-*; do
            sha256sum "$file" > "$file.sha256"
          done
          cd ../dist
          sha256sum sight-server.js > sight-server.js.sha256
          cd ../client
          if [ -f *.vsix ]; then
            sha256sum *.vsix > "$(basename *.vsix).sha256"
          fi

      - name: Upload release artifacts
        # Pinned action SHA for supply-chain safety (see note above).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/sight-*
            dist/sight-server.js
            dist/sight-server.js.sha256
            client/*.vsix
            client/*.vsix.sha256

      - name: Trigger release publish workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          the_tag: ${{ inputs.tag || github.ref_name }}
          the_publish_vscode: ${{ vars.RELEASE_PUBLISH_VSCODE || 'false' }}
        run: >-
          gh workflow run release-publish.yml
          --ref "${{ github.event.repository.default_branch }}"
          -f tag="$the_tag"
          -f publish_vscode="$the_publish_vscode"
          -f build_run_id="$GITHUB_RUN_ID"
