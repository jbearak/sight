---
name: "Setup Bun + Node + deps"
description: |
  Checkout-independent setup: installs Bun, Node, and project dependencies

inputs:
  bun-version:
    description: "Bun version used by CI and release builds"
    required: false
    default: "1.3.13"
  node-version:
    description: "Node.js version (LTS recommended for CI stability)"
    required: false
    default: "24"
  registry-url:
    description: "Optional npm registry-url for publishing"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      # Pinned action SHA for supply-chain safety.
      # Tag v2.2.0 -> commit 0c5077e51419868618aeaa5fe8019c62421857d6
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Node.js
      # Pinned action SHA for supply-chain safety.
      # Tag v5 -> commit a0853c24544627f65ddf259abe73b1d18a591444
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    # Bun installs into node_modules, so caching speeds up all jobs.
    # We key off both root + client lockfiles because this repo is a workspace.
    - name: Cache dependencies
      # Pinned action SHA for supply-chain safety.
      # Tag v6 -> commit 2c8a9bd7457de244a408f35966fab2fb45fda9c8
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
      with:
        path: |
          node_modules
          client/node_modules
          ~/.bun/install/cache
        key: >-
          bun-${{ runner.os }}-${{ inputs.node-version }}-${{ inputs.bun-version }}-
          ${{ hashFiles('bun.lock', 'client/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.node-version }}-${{ inputs.bun-version }}-
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install
